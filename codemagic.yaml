# La carretera es mía — compilación Android en Codemagic (rama "carretera" del repositorio).
workflows:
  carretera-aab:
    name: La carretera es mía · Android .aab
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      android_signing:
        - fakeado_upload
    scripts:
      - name: Dependencias
        script: npm ci
      - name: Preparar el juego (sin recursos externos)
        script: npm run build && npm test
      - name: Copiar al proyecto Android
        script: npx cap sync android
      - name: Compilar el paquete .aab firmado
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
